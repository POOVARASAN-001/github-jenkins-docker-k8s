
apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-cicd-app
  template:
    metadata:
      labels:
        app: final-cicd-app
    spec:
      containers:
        - name: web
          image: nginx:stable
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: final-cicd-service
spec:
  type: NodePort
  selector:
    app: final-cicd-app
  ports:
    - port: 80
      targetPort: 80
